name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: {{pmCache}}
      - run: {{installCmd}}
      - run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: {{runPrefix}} lint
      - name: Format check
        run: {{runPrefix}} format:check
      - name: Unit tests
        run: {{runPrefix}} test:coverage
      - name: E2E tests
        run: {{runPrefix}} test:e2e
      - name: Source structure
        run: {{runPrefix}} test:colocate
      - name: Build
        run: {{runPrefix}} build
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
