name: Release Bumpers CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build --workspace packages/bumpers-cli

      - name: Pack CLI
        working-directory: packages/bumpers-cli
        run: npm pack

      - name: Verify package archive
        id: package
        working-directory: packages/bumpers-cli
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          archive="bumpers-${version}.tgz"
          test -f "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          sha256sum "$archive"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "packages/bumpers-cli/${{ steps.package.outputs.archive }}" --generate-notes
